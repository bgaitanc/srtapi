services:
  postgres:
    image: postgres:17-alpine
    container_name: srt_postgres_container
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srt_password}
      POSTGRES_DB: ${POSTGRES_DB:-DB_SRT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - srt_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srt_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  srt_backend:
    container_name: srt_backend_container
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST:-postgres};Port=5432;Database=${POSTGRES_DB:-DB_SRT};Username=${POSTGRES_USER:-srt_user};Password=${DB_PASSWORD:-srt_password};SslMode=${SSL_MODE:-Prefer}"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      AppSettings__Secret: ${JWT_SECRET:-default_secret_key_change_in_production_minimum_32_characters}
      AppSettings__Issuer: ${JWT_ISSUER:-https://localhost:8080}
      AppSettings__Audience: ${JWT_AUDIENCE:-srt-api-users}
      ExecuteMigrations: ${EXECUTE_MIGRATIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - srt_network

networks:
  srt_network:
    driver: bridge

volumes:
  pgdata:
